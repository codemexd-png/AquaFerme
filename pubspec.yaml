name: aquaproject_mobile
description: "Application mobile de gestion pour la ferme piscicole AquaTrack."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  go_router: ^14.0.0
  provider: ^6.1.0
  intl: ^0.19.0

  

  # Géolocalisation & Permissions (Cœur de tes tâches de vendredi)
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

flutter:
  uses-material-design: true

  # Configuration des dossiers de ressources d'AquaTrack
  assets:
    - assets/images/
    - assets/mocks/
